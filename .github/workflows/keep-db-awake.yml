# 2026-10-26 20:07 KST
name: keep-db-awake

on:
  schedule:
    - cron: "0 15 * * *" # 매일 00:00 KST(UTC 15:00)
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Supabase DB에 직접 질의해 일시정지를 막음
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          sudo apt-get update -y && sudo apt-get install -y postgresql-client
          psql "$DATABASE_URL" -c "select count(*) from tf_settings;"
